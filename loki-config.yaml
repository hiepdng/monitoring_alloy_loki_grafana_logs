auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info
  grpc_server_max_concurrent_streams: 1000

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

ingester:
  wal:
    enabled: true
    dir: /loki/wal

#ruler:
#  alertmanager_url: http://localhost:9093

# The frontend component that splits and caches incoming dashboard queries
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# Define index generation and the chunk storage engine format
schema_config:
  configs:
    - from: 2026-11-06
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Global configuration limits for multi-tenancy/ingestion
limits_config:
  volume_enabled: true
  discover_service_name: [service app application app_name name app_kubernetes_io_name container container_name k8s_container_name component workload job k8s_job_name]
  creation_grace_period: 10m
  max_line_size: 1256000     # Maximum line size in bytes for a single log line
  retention_period: 744h    # 31 days retention
